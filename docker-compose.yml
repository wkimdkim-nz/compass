# Local Postgres for Compass. Start it with `docker compose up -d --wait` (see README.md).
# No seed data, no pgAdmin — the schema comes from `dotnet ef database update`.
services:
  db:
    image: postgres:18-alpine
    # No container_name: Compose derives one from the project directory, so a second checkout
    # or a CI job on the same Docker host does not collide on a globally unique name.
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: compass
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 moved the data directory: mount /var/lib/postgresql, NOT the
      # pre-18 /var/lib/postgresql/data, or the container exits(1) on first start.
      - compass-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d compass"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The API image against the database above. Behind a profile, so `docker compose up` is still
  # only Postgres: `docker compose --profile api up --build` (see README.md).
  api:
    profiles: ["api"]
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Development: plain HTTP, so the session cookie must not be Secure-only — and the only
      # environment where a missing provider setting below means a stub rather than no start.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=compass
      DB_USERNAME: compass
      DB_PASSWORD: compass
      # The two market-data settings (ADR 0010), passed through from the calling shell because
      # neither belongs in source. Unset arrives here as blank, which the API treats as absent.
      Finnhub__ApiKey: ${FINNHUB_API_KEY:-}
      Edgar__ContactEmail: ${EDGAR_CONTACT_EMAIL:-}

volumes:
  compass-pgdata:
